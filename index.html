<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BreadCapital</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #f59e0b;
      color: black;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>🥖 BreadCapital</h2>

  <div class="card">
    <p>Producción: <b id="rate">0.0023 kg/s</b></p>
    <p>Pan acumulado:</p>
    <h2 id="balance">0.00</h2>
  </div>

  <div class="card">
    <button onclick="vender()">Vender Pan</button>
    <button onclick="mejorar()">Mejorar Horno</button>
  </div>
</div>

<script>
  // 🔥 TUS DATOS (YA CONFIGURADOS)
  const SUPABASE_URL = "https://hyrcvrmkyrzsucegmtxs.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cmN2cm1reXJ6c3VjZWdtdHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzODE3MTUsImV4cCI6MjA4OTk1NzcxNX0.LeKlQbZBX5DcnRL1C6l-2ph9vYHbKarmKVgVkMtzOnM";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // TELEGRAM
  const tg = Telegram.WebApp;
  tg.ready();
  tg.expand();

  const user = tg.initDataUnsafe.user;
  const userId = user ? user.id.toString() : "demo_user";

  let balance = 0;
  let rate = 0.0023;
  let lastUpdate = Date.now();

  async function cargarDatos() {
    let { data, error } = await supabase
      .from('users')
      .select('*')
      .eq('user_id', userId)
      .single();

    if (data) {
      balance = parseFloat(data.balance);
      rate = parseFloat(data.rate);
      lastUpdate = parseInt(data.last_update);
    } else {
      await supabase.from('users').insert([
        {
          user_id: userId,
          balance: 0,
          rate: 0.0023,
          last_update: Date.now()
        }
      ]);
    }

    calcularOffline();
    actualizarUI();
  }

  function calcularOffline() {
    let ahora = Date.now();
    let segundos = (ahora - lastUpdate) / 1000;
    balance += segundos * rate;
    lastUpdate = ahora;
  }

  function actualizarUI() {
    document.getElementById("balance").innerText = balance.toFixed(2);
    document.getElementById("rate").innerText = rate.toFixed(4) + " kg/s";
  }

  async function guardarDatos() {
    await supabase
      .from('users')
      .update({
        balance: balance,
        rate: rate,
        last_update: lastUpdate
      })
      .eq('user_id', userId);
  }

  function loop() {
    balance += rate;
    actualizarUI();
    guardarDatos();
  }

  setInterval(loop, 1000);

  function vender() {
    alert("Pan vendido (simulado)");
    balance = 0;
    guardarDatos();
  }

  function mejorar() {
    rate += 0.001;
    guardarDatos();
  }

  cargarDatos();
</script>

</body>
</html>
